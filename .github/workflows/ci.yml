name: Research validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
      PYTHONHASHSEED: "0"
      MPLBACKEND: Agg
    steps:
      - name: Check out source and archived evidence
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up recorded Python series
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install locked scientific dependencies
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip check

      - name: Audit evidence, test mechanisms and regenerate all three quick studies
        run: python validate.py --quick

      - name: Retain regenerated smoke-test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: simulation-smoke-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            experiments/feedback/quick_results/
            experiments/feedback/quick_figures/
            experiments/robustness/quick_results/
            experiments/robustness/quick_figures/
            experiments/baselines/quick_results/
            experiments/baselines/quick_figures/
